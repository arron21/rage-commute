<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#09090b" />
    <title>RAGE COMMUTE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=JetBrains+Mono:wght@700;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div class="canvas-container">
        <canvas id="game-canvas"></canvas>

        <!-- Minimal Top Bar Overlay -->
        <div class="hud-minimal">
          <div class="score-pill">
            <span id="hud-score">0</span>
            <span class="score-best">BEST <span id="hud-best">0</span></span>
          </div>

          <button id="btn-mute" class="icon-pill" title="Mute / Unmute Audio" aria-label="Toggle Mute">
            &#128266;
          </button>
        </div>

        <!-- Simple Start / Game Over Prompt -->
        <div id="start-overlay" class="stage-overlay">
          <div class="simple-card">
            <h1 id="overlay-title" class="simple-title">RAGE COMMUTE</h1>
            <p id="overlay-sub" class="simple-sub">TAP OR PRESS SPACE TO JUMP</p>
            <button id="btn-start-run" class="play-btn">PLAY</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
